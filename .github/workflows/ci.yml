name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:unit

      # @web/test-runner bundles its own Playwright — install from the fluid
      # package scope, not the root (which holds @playwright/test for a11y).
      - name: Install Playwright browsers (component tests)
        run: pnpm --filter @neutro/fluid exec playwright install chromium --with-deps

      - run: pnpm test:component

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @neutro/storybook build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: apps/storybook/storybook-static

  a11y:
    name: Accessibility (axe WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root-level @playwright/test — distinct from the @web/test-runner
      # playwright used in the test job above.
      - name: Install Playwright browsers (integration tests)
        run: pnpm exec playwright install chromium --with-deps

      - uses: actions/download-artifact@v4
        with:
          name: storybook-build
          path: apps/storybook/storybook-static

      - name: Serve Storybook and run axe tests
        # serve and wait-on are pinned devDependencies — no runtime npx pulls.
        # TEST_BASE_URL bypasses the webServer dev-start block in playwright.config.ts.
        run: |
          pnpm exec serve apps/storybook/storybook-static --listen 6006 &
          pnpm exec wait-on http://localhost:6006 --timeout 30000
          pnpm test:a11y
        env:
          TEST_BASE_URL: http://localhost:6006

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: storybook-build
          path: apps/storybook/storybook-static

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          workingDir: apps/storybook
          exitOnceUploaded: true
